name: Build APK

# Compila o APK na nuvem (gratuito para repositorio publico).
# Serve para quem nao quer/nao consegue rodar o Android Studio no notebook.
# Depois do build, baixe o APK em: Actions -> ultimo run -> Artifacts.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Sem chave fixa, cada runner gera uma chave de debug diferente e o Android
      # recusa instalar por cima da versao anterior. A primeira execucao cria o
      # arquivo e o publica como artifact para ser versionado no repositorio.
      - name: Garantir chave de assinatura
        run: |
          if [ ! -f chave-rotamais.jks ]; then
            echo "CHAVE_NOVA=1" >> $GITHUB_ENV
            keytool -genkeypair -v \
              -keystore chave-rotamais.jks \
              -storepass rotamais -keypass rotamais \
              -alias rotamais -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ROTA+, OU=Pessoal, O=ROTA+, L=Sombrio, ST=SC, C=BR"
          else
            echo "chave ja versionada no repositorio"
          fi

      - name: Publicar chave gerada (versionar no repositorio)
        if: env.CHAVE_NOVA == '1'
        uses: actions/upload-artifact@v4
        with:
          name: chave-rotamais
          path: chave-rotamais.jks

      - name: Compilar APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Relatorio do APK (permissoes, sdk, assinatura)
        run: |
          set -x
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          {
            echo "=== ARQUIVO ==="
            ls -l "$APK"
            sha256sum "$APK"
            echo
            echo "=== BADGING (sdk, permissoes efetivas apos merge) ==="
            "${BT}aapt2" dump badging "$APK"
            echo
            echo "=== PERMISSOES (lista limpa) ==="
            "${BT}aapt2" dump permissions "$APK"
            echo
            echo "=== ASSINATURA ==="
            "${BT}apksigner" verify -v --print-certs "$APK"
          } > apk-report.txt 2>&1
          echo "----- inicio do relatorio -----"
          cat apk-report.txt

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: rotamais-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publicar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-report
          path: apk-report.txt
          if-no-files-found: warn
