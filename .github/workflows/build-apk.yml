name: Build APK

# Compila o APK na nuvem (gratuito para repositorio publico).
# Serve para quem nao quer/nao consegue rodar o Android Studio no notebook.
# Depois do build, baixe o APK em: Actions -> ultimo run -> Artifacts.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: rotamais-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
